# Runs on every push to main and every pull request (and before each release, see release.yml).
# 1. build-web.js  - every source file must parse
# 2. validate.js   - trees, field map, topic dossiers, HTML markup, lab coverage
# 3. smoke.js      - headless Chromium opens every screen at desktop and phone width; any JS error fails
name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/build-web.js
      - run: node tools/validate.js
      - name: Install Playwright (kept out of package.json so the app build stays lean)
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save playwright@1.56.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - run: node tools/smoke.js
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
