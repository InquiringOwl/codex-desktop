ARITH["fractions"] = {
  title: "Fractions & Equivalence",
  short: "Parts of a whole, and many names for one amount",
  grade: "Grades 3–4",
  hours: 8,
  voice: "mixed",
  eyebrow: "Rational numbers · fractions",
  hero: `<span class="m"><span class="fr"><span class="c1"><i>n</i></span><span class="c2"><i>d</i></span></span> = <span class="fr"><span><span class="c1"><i>n</i></span> × <span class="c4"><i>k</i></span></span><span><span class="c2"><i>d</i></span> × <span class="c4"><i>k</i></span></span></span></span>`,
  lede: `A fraction names equal parts of a whole. Multiplying top and bottom by the same number changes the name, not the amount.`,
  plain: `<p>Cut a chocolate bar into 4 equal pieces and eat 3. You ate <span class="m"><span class="fr"><span>3</span><span>4</span></span></span> of the bar. The bottom number, the <b>denominator</b>, says how many equal pieces the whole was cut into. The top number, the <b>numerator</b>, says how many of those pieces you have.</p>
<p>Now cut every piece in half. There are 8 pieces, and you ate 6 of them. You still ate the same amount of chocolate, so <span class="m"><span class="fr"><span>3</span><span>4</span></span> = <span class="fr"><span>6</span><span>8</span></span></span>. Fractions that name the same amount are <b>equivalent</b>. You get one by multiplying or dividing the top and bottom by the same number.</p>
<p>A fraction is also a division. <span class="m"><span class="fr"><span>3</span><span>4</span></span></span> is what each person gets when 3 pizzas are shared equally by 4 people. A fraction is in <b>simplest form</b> when the top and bottom have no common factor except 1.</p>`,
  formal: `<p>For integers <i>a</i> and <i>b</i> with <span class="m"><i>b</i> ≠ 0</span>, the <b>fraction</b> <span class="m"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span></span> denotes the quotient <span class="m"><i>a</i> ÷ <i>b</i></span>: the unique number that gives <i>a</i> when multiplied by <i>b</i>. Numbers expressible this way form the <b>rational numbers</b> ℚ.</p>
<div class="display"><span class="m"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span> = <span class="fr"><span><i>c</i></span><span><i>d</i></span></span>  ⟺  <i>ad</i> = <i>bc</i></span>  <span class="dim">(b, d ≠ 0)</span><br><span class="m"><span class="fr"><span><span class="c1"><i>n</i></span></span><span><span class="c2"><i>d</i></span></span></span> = <span class="fr"><span><span class="c1"><i>n</i></span><span class="c4"><i>k</i></span></span><span><span class="c2"><i>d</i></span><span class="c4"><i>k</i></span></span></span></span>  for any <span class="m"><i>k</i> ≠ 0</span></div>
<p>A fraction <span class="m"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span></span> with <span class="m"><i>b</i> &gt; 0</span> is in <b>lowest terms</b> when <span class="m">gcd(<i>a</i>, <i>b</i>) = 1</span>. Every rational number has exactly one such representation.</p>`,
  legend: [
    { c: "c1", sym: `<i>n</i>`, name: "Numerator", desc: "How many equal parts you have. The top number." },
    { c: "c2", sym: `<i>d</i>`, name: "Denominator", desc: "How many equal parts make one whole. The bottom number, never zero." },
    { c: "c4", sym: `<i>k</i>`, name: "Scale factor", desc: "The number both parts are multiplied or divided by to get an equivalent fraction. In the lab it splits every piece into k smaller pieces." }
  ],
  steps: { title: "How to simplify and compare fractions", items: [
    `Find the greatest common factor of the numerator and denominator.`,
    `Divide both by it. The result is in simplest form.`,
    `To compare two fractions, rewrite both with a common denominator, or cross-multiply.`,
    `With equal denominators, the fraction with the larger numerator is larger.`,
    `When cross-multiplying <span class="m"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span></span> and <span class="m"><span class="fr"><span><i>c</i></span><span><i>d</i></span></span></span> with positive denominators, compare <span class="m"><i>ad</i></span> with <span class="m"><i>bc</i></span>.`
  ] },
  example: {

  lede: `The square root of an area is the side length of the square with that area. It undoes squaring.`,
  plain: `<p>A square tile pattern that is 5 tiles on each side has 25 tiles. Squaring goes from side to area: <span class="m">5<sup>2</sup> = 25</span>. The <b>square root</b> goes the other way, from area back to side: <span class="m">√25 = 5</span>.</p>
<p>Numbers like 1, 4, 9, 16, 25 and 36 are <b>perfect squares</b> because they come from squaring whole numbers. Their square roots are whole numbers. Most numbers are not perfect squares. √20 lies between √16 = 4 and √25 = 5, a little under 4.5.</p>
<p>You can close in on a square root by guessing and improving. Guess a side, divide the area by your guess, and average the two numbers. That average is a better guess. The ancient Babylonians used this method, and it gets very accurate after only a few rounds.</p>
<p>The √ symbol always means the non-negative root. Both 5 and −5 square to 25, but √25 is 5.</p>`,
  formal: `<p>For a real number <span class="m"><i>A</i> ≥ 0</span>, the <b>principal square root</b> <span class="m">√<i>A</i></span> is the unique real number <span class="m"><i>s</i> ≥ 0</span> with <span class="m"><i>s</i><sup>2</sup> = <i>A</i></span>. An integer <i>A</i> is a <b>perfect square</b> if <span class="m"><i>A</i> = <i>k</i><sup>2</sup></span> for some integer <i>k</i>. The equation <span class="m"><i>x</i><sup>2</sup> = <i>A</i></span> with <span class="m"><i>A</i> &gt; 0</span> has two solutions, <span class="m"><i>x</i> = ±√<i>A</i></span>.</p>
<div class="display"><span class="m">√(<i>ab</i>) = √<i>a</i> · √<i>b</i></span>,  <span class="m">√(<i>a</i>/<i>b</i>) = √<i>a</i> / √<i>b</i></span>  <span class="dim">(a ≥ 0, b &gt; 0)</span><br><span class="m">√(<i>x</i><sup>2</sup>) = |<i>x</i>|</span><br>Babylonian (Newton) iteration: <span class="m"><span class="c3"><i>x</i></span><sub><i>k</i>+1</sub> = <span class="fr"><span>1</span><span>2</span></span>(<span class="c3"><i>x</i></span><sub><i>k</i></sub> + <span class="c1"><i>A</i></span>/<span class="c3"><i>x</i></span><sub><i>k</i></sub>)</span></div>
<p>If a positive integer is not a perfect square, its square root is irrational. For example <span class="m">√2</span> cannot be written as a ratio of integers.</p>`,

  steps: { title: "How to estimate a square root", items: [

      { math: `<span class="m"><span class="c3"><i>x</i></span><sub>1</sub> = (14 + 200/14) ÷ 2 ≈ (14 + 14.2857) ÷ 2 ≈ <span class="c3">14.1429</span></span>`, note: "One Babylonian step from the guess 14." },

ARITH["gcf-lcm"] = {
  title: "GCF, LCM & the Euclidean Algorithm",
  short: "The largest shared factor and smallest shared multiple",
  grade: "Grade 6 (Euclidean algorithm: college prep)",
  hours: 5,
  voice: "plain",
  eyebrow: "Number theory · common divisors and multiples",
  hero: `<span class="m"><span class="c1">gcd(<i>a</i>, <i>b</i>)</span> × <span class="c4">lcm(<i>a</i>, <i>b</i>)</span> = <span class="c2"><i>a</i></span> × <span class="c3"><i>b</i></span></span>`,
  lede: `The GCF is the biggest number that divides both. The LCM is the smallest number both divide. For positive integers, their product is a × b.`,
  plain: `<p>The <b>greatest common factor</b> (GCF, also called the greatest common divisor, gcd) of two numbers is the largest number that divides both. The factors of 12 are 1, 2, 3, 4, 6, 12 and the factors of 18 are 1, 2, 3, 6, 9, 18. The largest one on both lists is 6.</p>
<p>The <b>least common multiple</b> (LCM) is the smallest number that is a multiple of both. Counting by 6s gives 6, 12, 18, 24 and counting by 8s gives 8, 16, 24. The first number on both lists is 24.</p>
<p>Listing gets slow for big numbers. The <b>Euclidean algorithm</b> is a faster way to find the GCF. Picture an <i>a</i> by <i>b</i> rectangle. Cut off the biggest squares you can, then repeat on the leftover strip. The last square size that fits with nothing left over is the GCF. In numbers: divide, keep the remainder, and repeat with the divisor and remainder until the remainder is 0.</p>`,
  formal: `<p>For integers <i>a</i>, <i>b</i> not both zero, <span class="m">gcd(<i>a</i>, <i>b</i>)</span> is the largest integer dividing both. For nonzero <i>a</i>, <i>b</i>, <span class="m">lcm(<i>a</i>, <i>b</i>)</span> is the smallest positive integer that both divide. For positive integers, <span class="m">gcd(<i>a</i>, <i>b</i>) · lcm(<i>a</i>, <i>b</i>) = <i>ab</i></span>.</p>
<div class="display"><b>Euclidean algorithm.</b> If <span class="m"><i>a</i> = <i>bq</i> + <i>r</i></span> with <span class="m">0 ≤ <i>r</i> &lt; <i>b</i></span>, then <span class="m">gcd(<i>a</i>, <i>b</i>) = gcd(<i>b</i>, <i>r</i>)</span>, and <span class="m">gcd(<i>a</i>, 0) = |<i>a</i>|</span>.<br>From prime factorizations <span class="m"><i>a</i> = ∏ <i>p</i><sup><i>α</i><sub><i>p</i></sub></sup></span>, <span class="m"><i>b</i> = ∏ <i>p</i><sup><i>β</i><sub><i>p</i></sub></sup></span>:<br><span class="m">gcd = ∏ <i>p</i><sup>min(<i>α</i><sub><i>p</i></sub>, <i>β</i><sub><i>p</i></sub>)</sup></span>,  <span class="m">lcm = ∏ <i>p</i><sup>max(<i>α</i><sub><i>p</i></sub>, <i>β</i><sub><i>p</i></sub>)</sup></span></div>
<p><b>Bézout's identity:</b> there are integers <i>x</i>, <i>y</i> with <span class="m"><i>ax</i> + <i>by</i> = gcd(<i>a</i>, <i>b</i>)</span>. The extended Euclidean algorithm finds them. Numbers with gcd 1 are called <b>relatively prime</b> (coprime).</p>`,
  legend: [
    { c: "c2", sym: `<i>a</i>`, name: "First number", desc: "The long side of the rectangle in the lab." },
    { c: "c3", sym: `<i>b</i>`, name: "Second number", desc: "The short side of the rectangle." },
    { c: "c1", sym: `gcd(<i>a</i>, <i>b</i>)`, name: "Greatest common factor", desc: "The largest square that tiles the whole rectangle exactly." },
    { c: "c4", sym: `lcm(<i>a</i>, <i>b</i>)`, name: "Least common multiple", desc: "The smallest number both a and b divide. It equals a × b ÷ gcd." }
  ],
  steps: { title: "How to run the Euclidean algorithm", items: [
    `Divide the larger number <i>a</i> by the smaller <i>b</i> and find the remainder <i>r</i>, so <span class="m"><i>a</i> = <i>bq</i> + <i>r</i></span>.`,
    `If <span class="m"><i>r</i> = 0</span>, then <i>b</i> is the GCF. Stop.`,
    `Otherwise replace <span class="m">(<i>a</i>, <i>b</i>)</span> with <span class="m">(<i>b</i>, <i>r</i>)</span> and repeat.`,
    `The last nonzero remainder is the GCF.`,
    `For the LCM, compute <span class="m"><i>a</i> × <i>b</i> ÷ gcd(<i>a</i>, <i>b</i>)</span>. Dividing one number by the GCF first keeps the numbers small.`
  ] },
  example: {
    prompt: `A room is 1,071 cm by 462 cm. What is the largest square tile, in whole centimetres, that covers the floor exactly with no cutting, and how many tiles are needed?`,
    lines: [
      { math: `<span class="m"><span class="c2">1071</span> = <span class="c3">462</span> × 2 + 147</span>`, note: "Two 462 cm squares fit along the long side, leaving a 147 cm strip." },
      { math: `<span class="m"><span class="c3">462</span> = 147 × 3 + 21</span>`, note: "Three 147 cm squares fit in the strip, leaving 21 cm." },
      { math: `<span class="m">147 = <span class="c1">21</span> × 7 + 0</span>`, note: "Remainder 0, so the last divisor is the GCF." },
      { math: `<span class="m">gcd(<span class="c2">1071</span>, <span class="c3">462</span>) = <span class="c1">21</span></span>`, note: "Check: 1071 = 21 × 51 and 462 = 21 × 22." },

    answer: `The largest tile is <span class="m">21</span> cm by 21 cm, and <span class="m">1,122</span> tiles are needed.`

  why: `<p>The GCF answers "what is the biggest equal group or piece?" and the LCM answers "when will these cycles line up again?" You use them to cut materials without waste, to find when two buses or schedules coincide, and to simplify fractions or find common denominators.</p>
<p>The Euclidean algorithm is one of the oldest algorithms still in use. Its extended form computes modular inverses, which RSA encryption needs to build its private key.</p>`,

<p>To compare decimals, line up the decimal points and compare place by place from the left. Writing zeros at the end does not change a decimal: 0.5 and 0.50 are the same amount. This makes it easy to see that 0.5 is larger than 0.45, even though 45 looks bigger than 5.</p>

<p>A terminating decimal with <i>n</i> digits after the point equals a fraction with denominator <span class="m">10<sup><i>n</i></sup></span>. A fraction in lowest terms has a terminating decimal expansion if and only if its denominator has no prime factors other than 2 and 5. Every other rational number has an eventually repeating expansion, and every eventually repeating decimal is rational.</p>`,

  hero: `<span class="m"><span class="c1"><i>w</i></span> <span class="fr"><span class="c3"><i>r</i></span><span class="c2"><i>d</i></span></span> = <span class="fr"><span><span class="c1"><i>w</i></span> × <span class="c2"><i>d</i></span> + <span class="c3"><i>r</i></span></span><span class="c2"><i>d</i></span></span></span>`,
  lede: `A mixed number is a whole number plus a proper fraction. It names the same amount as an improper fraction.`,
  plain: `<p>Suppose you have two whole pies and three quarters of another. You could say "2 and 3/4 pies", written <span class="m">2 <span class="fr"><span>3</span><span>4</span></span></span>. That is a <b>mixed number</b>: a whole part and a fraction part.</p>
<p>You could also cut every pie into quarters and count the slices. Each whole pie gives 4 slices, so 2 pies give 8, plus 3 more makes 11 quarters. That is <span class="m"><span class="fr"><span>11</span><span>4</span></span></span>, an <b>improper fraction</b> because the top is at least as big as the bottom.</p>
<p>To go back, divide. 11 ÷ 4 is 2 with remainder 3, so <span class="m"><span class="fr"><span>11</span><span>4</span></span> = 2 <span class="fr"><span>3</span><span>4</span></span></span>. The quotient is the number of whole pies and the remainder is the leftover slices.</p>
<p>Mixed numbers are easier to picture and to measure with. Improper fractions are easier to calculate with.</p>`,
  formal: `<p>A fraction <span class="m"><span class="fr"><span><i>n</i></span><span><i>d</i></span></span></span> with <span class="m"><i>n</i> ≥ <i>d</i> &gt; 0</span> is <b>improper</b>. By the division algorithm, <span class="m"><i>n</i> = <i>dw</i> + <i>r</i></span> with integers <span class="m"><i>w</i> ≥ 1</span> and <span class="m">0 ≤ <i>r</i> &lt; <i>d</i></span>, so</p>
<div class="display"><span class="m"><span class="fr"><span><i>n</i></span><span><span class="c2"><i>d</i></span></span></span> = <span class="c1"><i>w</i></span> + <span class="fr"><span><span class="c3"><i>r</i></span></span><span><span class="c2"><i>d</i></span></span></span></span>, written <span class="m"><span class="c1"><i>w</i></span> <span class="fr"><span class="c3"><i>r</i></span><span class="c2"><i>d</i></span></span></span><br><span class="dim">Juxtaposition here means addition, not multiplication.</span></div>
<p>For a negative mixed number the sign applies to the whole amount: <span class="m">−<i>w</i> <span class="fr"><span><i>r</i></span><span><i>d</i></span></span> = −(<i>w</i> + <span class="fr"><span><i>r</i></span><span><i>d</i></span></span>)</span>. The fraction part is in lowest terms when <span class="m">gcd(<i>r</i>, <i>d</i>) = 1</span>.</p>`,

      { math: `<span class="m">8 ÷ <span class="c2">3</span> = <span class="c1">2</span> R <span class="c3">2</span></span>`, note: "Check by converting back: 2 wholes and 2 thirds." }

  hours: 5,
  voice: "mixed",
  eyebrow: "Multiplicative reasoning · ratios and rates",
  hero: `<span class="m"><span class="c2"><i>a</i></span> : <span class="c3"><i>b</i></span> = <span class="c4"><i>k</i></span><span class="c2"><i>a</i></span> : <span class="c4"><i>k</i></span><span class="c3"><i>b</i></span></span>`,
  lede: `A ratio says how much of one thing there is for each amount of another. Scaling both parts by the same number <span class="m c4"><i>k</i></span> keeps the ratio the same.`,
  plain: `<p>Say a lemonade recipe uses 2 cups of concentrate for every 5 cups of water. That is a <b>ratio</b> of 2 to 5, written <span class="m">2 : 5</span>. It tells you the mix, not the size of the batch.</p>
<p>Double the batch and you use 4 cups and 10 cups. Triple it and you use 6 and 15. The drink tastes the same each time because both parts grew by the same factor. Those are <b>equivalent ratios</b>.</p>
<p>A <b>rate</b> is a ratio between two different kinds of things, like miles and hours or dollars and ounces. When you shrink a rate so the second amount is 1, you get a <b>unit rate</b>: 60 miles per 1 hour, or 29 cents per 1 ounce. Unit rates make comparisons easy.</p>`,
  formal: `<p>For quantities <span class="m"><i>a</i></span> and <span class="m"><i>b</i></span> with <span class="m"><i>b</i> ≠ 0</span>, the <b>ratio</b> <span class="m"><i>a</i> : <i>b</i></span> is the comparison of <span class="m"><i>a</i></span> to <span class="m"><i>b</i></span> by division, with associated value <span class="m"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span></span>. Order matters: <span class="m"><i>a</i> : <i>b</i></span> and <span class="m"><i>b</i> : <i>a</i></span> are different ratios.</p>
<div class="display">Equivalence: <span class="c2"><i>a</i></span> : <span class="c3"><i>b</i></span> = <i>c</i> : <i>d</i> &nbsp;⇔&nbsp; <i>ad</i> = <i>bc</i> &nbsp;<span class="dim">(<i>b</i>, <i>d</i> ≠ 0)</span><br>Scaling: <span class="c2"><i>a</i></span> : <span class="c3"><i>b</i></span> = <span class="c4"><i>k</i></span><span class="c2"><i>a</i></span> : <span class="c4"><i>k</i></span><span class="c3"><i>b</i></span> &nbsp;for any <span class="c4"><i>k</i></span> ≠ 0<br>Unit rate of <i>a</i> per <i>b</i>: <span class="fr"><span><i>a</i></span><span><i>b</i></span></span> : 1</div>
<p>A ratio of whole numbers is in <b>simplest form</b> when <span class="m">gcd(<i>a</i>, <i>b</i>) = 1</span>. A <b>rate</b> is a ratio of quantities measured in different units. Its unit is the quotient of the two units, such as mi/h.</p>`,

ARITH["fraction-ops"] = {
  title: "Operations with Fractions",
  short: "Add, subtract, multiply and divide fractions",
  grade: "Grades 4–6",
  hours: 10,
  voice: "mixed",
  eyebrow: "Rational numbers · the four operations",
  hero: `<span class="m"><span class="c2"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span></span> + <span class="c3"><span class="fr"><span><i>c</i></span><span><i>d</i></span></span></span> = <span class="c1"><span class="fr"><span><i>ad</i> + <i>bc</i></span><span class="c4"><i>bd</i></span></span></span></span>`,
  lede: `You can only add pieces that are the same size. Rewrite both fractions over a <span class="m c4">common denominator</span>, then add the numerators.`,
  plain: `<p>Two thirds of a pizza plus three quarters of a pizza. How much is that? You cannot just add the tops and bottoms. Thirds and quarters are different-sized slices, so first you cut both pizzas into slices of the same size. Twelfths work: two thirds is 8 twelfths, three quarters is 9 twelfths, and together they make 17 twelfths.</p>
<p>That is the whole idea behind adding and subtracting fractions. Find a <b>common denominator</b>, rename each fraction, then add or subtract the numerators. The denominator stays the same because the slice size did not change.</p>
<p>Multiplying is simpler. "Two thirds of three quarters" means multiply tops and multiply bottoms. Dividing asks "how many of these fit into that?" You answer it by flipping the second fraction and multiplying.</p>`,
  formal: `<p>For integers <span class="m"><i>a</i>, <i>b</i>, <i>c</i>, <i>d</i></span> with <span class="m"><i>b</i>, <i>d</i> ≠ 0</span>, the operations on ℚ are defined by:</p>
<div class="display"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span> ± <span class="fr"><span><i>c</i></span><span><i>d</i></span></span> = <span class="fr"><span><i>ad</i> ± <i>bc</i></span><span><i>bd</i></span></span> &nbsp;&nbsp; <span class="fr"><span><i>a</i></span><span><i>b</i></span></span> × <span class="fr"><span><i>c</i></span><span><i>d</i></span></span> = <span class="fr"><span><i>ac</i></span><span><i>bd</i></span></span> &nbsp;&nbsp; <span class="fr"><span><i>a</i></span><span><i>b</i></span></span> ÷ <span class="fr"><span><i>c</i></span><span><i>d</i></span></span> = <span class="fr"><span><i>a</i></span><span><i>b</i></span></span> × <span class="fr"><span><i>d</i></span><span><i>c</i></span></span> <span class="dim">(<i>c</i> ≠ 0)</span></div>
<p>The <b>least common denominator</b> is <span class="m c4"><i>L</i> = lcm(<i>b</i>, <i>d</i>)</span>, giving <span class="m"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span> + <span class="fr"><span><i>c</i></span><span><i>d</i></span></span> = <span class="fr"><span><i>a</i>(<i>L</i>/<i>b</i>) + <i>c</i>(<i>L</i>/<i>d</i>)</span><span><i>L</i></span></span></span>. The fraction <span class="m"><span class="fr"><span><i>d</i></span><span><i>c</i></span></span></span> is the <b>reciprocal</b> (multiplicative inverse) of <span class="m"><span class="fr"><span><i>c</i></span><span><i>d</i></span></span></span>. Results are usually reduced to lowest terms by dividing numerator and denominator by their gcd.</p>`,
  legend: [
    { c: "c2", sym: `<span class="fr"><span><i>a</i></span><span><i>b</i></span></span>`, name: "First fraction", desc: "The first operand. On the lab's top bar." },
    { c: "c3", sym: `<span class="fr"><span><i>c</i></span><span><i>d</i></span></span>`, name: "Second fraction", desc: "The second operand. On the lab's lower bar." },
    { c: "c4", sym: `<i>L</i>`, name: "Common denominator", desc: "A shared slice size both fractions can be written in. The least one is lcm(b, d)." },
    { c: "c1", sym: `<i>R</i>`, name: "Result", desc: "The sum, difference, product or quotient, reduced to lowest terms." }
  ],
  steps: { title: "How to operate on fractions", items: [
    `<b>Add or subtract:</b> find the least common denominator <span class="m c4">lcm(<i>b</i>, <i>d</i>)</span>.`,
    `Rename each fraction by multiplying its numerator and denominator by the same number so the denominator is <span class="m c4"><i>L</i></span>.`,
    `Add or subtract the numerators. Keep the denominator.`,

    `<b>Divide:</b> keep the first fraction, change ÷ to ×, and use the reciprocal of the second.`,

  example: {
    prompt: `You are baking. The cookies need <span class="m"><span class="fr"><span>2</span><span>3</span></span></span> cup of flour and the bread needs <span class="m"><span class="fr"><span>3</span><span>4</span></span></span> cup. Your bag holds <span class="m">2<span class="fr"><span>1</span><span>2</span></span></span> cups. How much flour do you use, and how much is left?`,
    lines: [

      { math: `<span class="m"><span class="fr"><span>8</span><span>12</span></span> + <span class="fr"><span>9</span><span>12</span></span> = <span class="c1"><span class="fr"><span>17</span><span>12</span></span></span> = 1<span class="fr"><span>5</span><span>12</span></span></span>`, note: "Flour used." },
      { math: `<span class="m">2<span class="fr"><span>1</span><span>2</span></span> = <span class="fr"><span>5</span><span>2</span></span> = <span class="fr"><span>30</span><span>12</span></span></span>`, note: "Write the bag's amount in twelfths too." },
      { math: `<span class="m"><span class="fr"><span>30</span><span>12</span></span> − <span class="fr"><span>17</span><span>12</span></span> = <span class="c1"><span class="fr"><span>13</span><span>12</span></span></span> = 1<span class="fr"><span>1</span><span>12</span></span></span>`, note: "Flour left over." }
    ],
    answer: `You use <span class="m">1<span class="fr"><span>5</span><span>12</span></span></span> cups and have <span class="m">1<span class="fr"><span>1</span><span>12</span></span></span> cups left.`
  },
  why: `<p>Fractions show up whenever something is shared or measured in parts: recipes, tape measures in inches, music time signatures, stock splits and medicine doses. Being able to combine them exactly, without rounding to decimals, avoids small errors that add up.</p>
<p>Algebra is built on these rules. Adding rational expressions such as <span class="m"><span class="fr"><span>1</span><span><i>x</i></span></span> + <span class="fr"><span>1</span><span><i>x</i> + 1</span></span></span> uses the same common-denominator method, and solving equations constantly multiplies by reciprocals.</p>`,
  careers: [

  life: [

  fields: [

  prereqWhy: {

  unlocksWhy: {

  mistakes: [

ARITH["decimal-ops"] = {
  title: "Operations with Decimals",
  short: "Add, subtract, multiply and divide decimals",
  grade: "Grades 5–6",
  hours: 8,
  voice: "mixed",
  eyebrow: "Base ten · decimal arithmetic",
  hero: `<span class="m"><span class="c2">0.3</span> × <span class="c3">0.4</span> = <span class="c1">0.12</span></span>`,
  lede: `Three tenths of four tenths is twelve hundredths. The decimal places of the factors add up in the product.`,
  plain: `<p>Decimals are just base-ten numbers that keep going to the right of the ones place. So adding and subtracting them works like whole numbers, as long as you line up the decimal points. Tenths go under tenths, hundredths under hundredths.</p>
<p>Multiplying is where people get surprised. Take <span class="m">0.3 × 0.4</span>. Picture a square cut into a 10 by 10 grid. Shade 3 columns and 4 rows. The overlap is 12 little squares out of 100, so the answer is 0.12. Tenths times tenths gives hundredths. That is why you count the decimal places in both numbers and put that many in the answer.</p>
<p>To divide by a decimal, slide the decimal point in both numbers the same number of places until the divisor is a whole number. The answer does not change, because you multiplied both by the same power of ten.</p>`,
  formal: `<p>A terminating decimal with <span class="m"><i>j</i></span> digits after the point is the fraction <span class="m"><span class="fr"><span><i>m</i></span><span>10<sup><i>j</i></sup></span></span></span> for some integer <span class="m"><i>m</i></span>. The operations follow from fraction arithmetic:</p>
<div class="display"><span class="c2"><span class="fr"><span><i>m</i></span><span>10<sup><i>j</i></sup></span></span></span> × <span class="c3"><span class="fr"><span><i>n</i></span><span>10<sup><i>k</i></sup></span></span></span> = <span class="c1"><span class="fr"><span><i>mn</i></span><span>10<sup><i>j</i>+<i>k</i></sup></span></span></span><br><i>x</i> ÷ <i>y</i> = (<i>x</i> · 10<sup><i>k</i></sup>) ÷ (<i>y</i> · 10<sup><i>k</i></sup>) &nbsp;<span class="dim">(<i>y</i> ≠ 0)</span></div>
<p>For addition and subtraction, write both numbers over the common denominator <span class="m">10<sup>max(<i>j</i>,<i>k</i>)</sup></span>, which is what aligning decimal points does. A quotient of terminating decimals may be a repeating decimal, for example <span class="m">1 ÷ 0.3 = 3.333…</span></p>`,

    { c: "c1", sym: `<i>xy</i>`, name: "Product", desc: "The overlap of the rows and columns. Its decimal places equal the sum of the factors' decimal places." },
    { c: "c4", sym: `10<sup><i>k</i></sup>`, name: "Power of ten", desc: "Multiplying by 10 moves every digit one place left. Used to clear the decimal from a divisor." }
  ],
  steps: { title: "How to compute with decimals", items: [

  example: {

      { math: `<span class="m"><span class="c2">2.75</span> × <span class="c3">6.40</span> = <span class="c1">17.6000</span> = 17.60</span>`, note: "Place the point four places from the right." },

ARITH["sci-notation"] = {
  title: "Scientific Notation",
  short: "Writing huge and tiny numbers with powers of ten",
  grade: "Grade 8",
  hours: 5,
  voice: "plain",
  eyebrow: "Powers of ten · orders of magnitude",
  hero: `<span class="m"><span class="c2"><i>c</i></span> × 10<sup class="c3"><i>n</i></sup>, &nbsp; 1 ≤ |<span class="c2"><i>c</i></span>| &lt; 10</span>`,
  lede: `Any nonzero number can be written as a coefficient between 1 and 10 times a power of ten. The exponent tells you its size at a glance.`,
  plain: `<p>The distance from Earth to the Sun is about 149,600,000,000 metres. A hydrogen atom is about 0.0000000001 metres across. Numbers like these are hard to read and easy to miscount. Scientific notation fixes that.</p>
<p>You write the number as a short decimal between 1 and 10, called the <b>coefficient</b>, times 10 to some power. The Sun's distance becomes <span class="m">1.496 × 10<sup>11</sup></span> m. The atom becomes <span class="m">1 × 10<sup>−10</sup></span> m. A positive exponent means a big number. A negative exponent means a small one.</p>
<p>It also makes arithmetic easier. To multiply, multiply the coefficients and add the exponents. To divide, divide the coefficients and subtract the exponents. Then tidy up so the coefficient is back between 1 and 10.</p>`,
  formal: `<p>Every nonzero real number <span class="m"><i>x</i></span> has a unique representation</p>
<div class="display"><i>x</i> = <span class="c2"><i>c</i></span> × 10<sup class="c3"><i>n</i></sup>, &nbsp; 1 ≤ |<span class="c2"><i>c</i></span>| &lt; 10, &nbsp; <span class="c3"><i>n</i></span> ∈ ℤ, &nbsp; <span class="dim"><span class="c3"><i>n</i></span> = ⌊log<sub>10</sub>|<i>x</i>|⌋</span></div>
<p>Using the laws of exponents, <span class="m">(<i>c</i><sub>1</sub> × 10<sup><i>m</i></sup>)(<i>c</i><sub>2</sub> × 10<sup><i>n</i></sup>) = <i>c</i><sub>1</sub><i>c</i><sub>2</sub> × 10<sup><i>m</i>+<i>n</i></sup></span> and <span class="m">(<i>c</i><sub>1</sub> × 10<sup><i>m</i></sup>) ÷ (<i>c</i><sub>2</sub> × 10<sup><i>n</i></sup>) = (<i>c</i><sub>1</sub>/<i>c</i><sub>2</sub>) × 10<sup><i>m</i>−<i>n</i></sup></span>, followed by renormalising the coefficient. The digits of <span class="m c2"><i>c</i></span> are the <b>significant figures</b> of the measurement, and <span class="m c3"><i>n</i></span> is its <b>order of magnitude</b>. Calculators often display <span class="m">1.496 × 10<sup>11</sup></span> as <span class="m">1.496E11</span>.</p>`,
  legend: [
    { c: "c2", sym: `<i>c</i>`, name: "Coefficient", desc: "A number with absolute value at least 1 and less than 10. Its digits are the significant figures." },
    { c: "c3", sym: `<i>n</i>`, name: "Exponent", desc: "An integer. It counts how many places the decimal point moved. Positive for large numbers, negative for small ones." },
    { c: "c1", sym: `10<sup><i>n</i></sup>`, name: "Power of ten", desc: "The scale. Each step of 1 in n is a factor of 10 on the lab's ruler." }
  ],
  steps: { title: "How to write and compute in scientific notation", items: [
    `Move the decimal point until exactly one nonzero digit is to its left. That gives the coefficient <span class="m c2"><i>c</i></span>.`,
    `Count the places moved. Moving left gives a positive <span class="m c3"><i>n</i></span>. Moving right gives a negative <span class="m c3"><i>n</i></span>.`,
    `To multiply, multiply coefficients and add exponents. To divide, divide coefficients and subtract exponents.`,

  example: {
    prompt: `Light travels about <span class="m">3.00 × 10<sup>8</sup></span> metres per second. The Sun is about <span class="m">1.496 × 10<sup>11</sup></span> metres from Earth. How long does sunlight take to reach us?`,
    lines: [

      { math: `<span class="m"><span class="c2">0.4987</span> × 10<sup class="c3">3</sup></span>`, note: "Divide coefficients (1.496 ÷ 3.00 ≈ 0.4987) and subtract exponents (11 − 8 = 3)." },
      { math: `<span class="m"><span class="c2">4.99</span> × 10<sup class="c3">2</sup> s</span>`, note: "Renormalise: multiply the coefficient by 10, subtract 1 from the exponent, round to 3 significant figures." },
      { math: `<span class="m">499 ÷ 60 ≈ 8.3</span> min`, note: "Convert seconds to minutes." }

  why: `<p>Science works across enormous ranges of size, from 10<sup>−15</sup> m for an atomic nucleus to 10<sup>26</sup> m for the observable universe. Scientific notation makes those numbers readable, comparable and easy to multiply. It also shows how precise a measurement is through its significant figures.</p>
<p>Computers store real numbers in a binary version of the same idea, called floating point. Logarithms, which appear throughout algebra, chemistry (pH) and acoustics (decibels), are essentially the exponent part of scientific notation.</p>`,

  fields: [

ARITH["proportions"] = {
  title: "Proportions",
  short: "Two equal ratios, one missing value",
  grade: "Grades 6–7",
  hours: 6,
  voice: "mixed",
  eyebrow: "Multiplicative reasoning · equal ratios",
  hero: `<span class="m"><span class="fr"><span class="c2"><i>a</i></span><span class="c2"><i>b</i></span></span> = <span class="fr"><span class="c2"><i>c</i></span><span class="c1"><i>x</i></span></span> &nbsp;⇒&nbsp; <span class="c1"><i>x</i></span> = <span class="fr"><span><i>bc</i></span><span><i>a</i></span></span></span>`,
  lede: `A proportion says two ratios are equal. If three of the four numbers are known, the fourth is determined.`,
  plain: `<p>Suppose your car used 9 gallons to drive 252 miles. How much gas will a 420-mile trip take? If the car burns gas at a steady rate, the ratio of gallons to miles stays the same. So you set up two equal ratios, one you know and one with a blank, and fill in the blank.</p>
<p>That equation, <span class="m">9/252 = <i>x</i>/420</span>, is a <b>proportion</b>. The quick way to solve it is <b>cross-multiplication</b>: multiply diagonally across the equals sign and you get <span class="m">252<i>x</i> = 9 × 420</span>. Then divide.</p>
<p>The important check is whether the situation really is proportional. Twice the distance means twice the gas, so yes. But twice the workers usually means half the time, not twice the time. That is a different kind of relationship.</p>`,
  formal: `<p>A <b>proportion</b> is an equation <span class="m"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span> = <span class="fr"><span><i>c</i></span><span><i>d</i></span></span></span> with <span class="m"><i>b</i>, <i>d</i> ≠ 0</span>. The <b>cross-product property</b> states</p>
<div class="display"><span class="fr"><span><i>a</i></span><span><i>b</i></span></span> = <span class="fr"><span><i>c</i></span><span><i>d</i></span></span> &nbsp;⇔&nbsp; <i>ad</i> = <i>bc</i> &nbsp;<span class="dim">(multiply both sides by <i>bd</i>)</span></div>
<p>Two quantities <span class="m"><i>x</i></span> and <span class="m"><i>y</i></span> are <b>directly proportional</b> if <span class="m"><i>y</i> = <i>kx</i></span> for a constant <span class="m"><i>k</i> ≠ 0</span>, the <b>constant of proportionality</b>. Then <span class="m"><i>y</i>/<i>x</i></span> is the same for every pair, so any two pairs form a proportion. They are <b>inversely proportional</b> if <span class="m"><i>xy</i> = <i>k</i></span>, which does not give a proportion of this form.</p>`,
  legend: [
    { c: "c2", sym: `<i>a</i> : <i>b</i>`, name: "Known pair", desc: "A matched pair of values you already know, such as 9 gallons for 252 miles." },
    { c: "c2", sym: `<i>c</i>`, name: "Known value of the new pair", desc: "The value you have for the new situation, such as 420 miles." },
    { c: "c1", sym: `<i>x</i>`, name: "Unknown", desc: "The missing value that keeps the two ratios equal." },
    { c: "c4", sym: `<i>k</i>`, name: "Constant of proportionality", desc: "The fixed ratio y/x. On the double number line it is how far one line stretches relative to the other." }
  ],
  steps: { title: "How to solve a proportion", items: [
    `Check that the situation is proportional: doubling one quantity should double the other.`,
    `Write the known ratio with units, such as <span class="m">gallons/miles</span>.`,
    `Write the second ratio in the same order, with <span class="m c1"><i>x</i></span> for the unknown.`,
    `Cross-multiply to get <span class="m"><i>ad</i> = <i>bc</i></span>.`,
    `Divide to isolate <span class="m c1"><i>x</i></span>.`,
    `Check by comparing the unit rates or plugging back in.`
  ] },
  example: {
    prompt: `Your car used 9 gallons of gas to drive 252 miles. At the same rate, how many gallons will a 420-mile trip use?`,
    lines: [
      { math: `<span class="m"><span class="fr"><span class="c2">9</span><span class="c2">252</span></span> = <span class="fr"><span class="c1"><i>x</i></span><span class="c2">420</span></span></span>`, note: "Gallons over miles on both sides." },
      { math: `<span class="m">252<span class="c1"><i>x</i></span> = 9 × 420</span>`, note: "Cross-multiply." },
      { math: `<span class="m">252<span class="c1"><i>x</i></span> = 3,780</span>`, note: "Multiply out the right side." },
      { math: `<span class="m"><span class="c1"><i>x</i></span> = 3,780 ÷ 252 = 15</span>`, note: "Divide both sides by 252." },
      { math: `<span class="m">252 ÷ 9 = 28 = 420 ÷ 15</span>`, note: "Check: both trips get 28 miles per gallon." }
    ],
    answer: `The trip will use <span class="m">15</span> gallons of gas.`

ARITH["averages"] = {
  title: "Mean, Median & Mode",

  hero: `<span class="m"><span class="c1"><i>x̄</i></span> = <span class="fr"><span><i>x</i><sub>1</sub> + <i>x</i><sub>2</sub> + ⋯ + <i>x</i><sub><i>n</i></sub></span><span><i>n</i></span></span></span>`,
  lede: `The mean is the balance point of the data. The median is the middle value, and the mode is the most common one.`,
  plain: `<p>If someone asks how long your commute usually takes, one number has to stand for many days. There are three common ways to pick that number.</p>
<p>The <b>mean</b> is what most people call the average. Add all the values and divide by how many there are. It is the point where the data would balance if each value were a weight on a ruler. The <b>median</b> is the middle value once you line them up in order. The <b>mode</b> is the value that shows up most often.</p>
<p>They can disagree. One awful 90-minute commute drags the mean up, but barely moves the median. That is why reports on house prices and incomes usually give the median. The mean uses every value. The median resists extreme ones.</p>`,
  formal: `<p>For data values <span class="m"><i>x</i><sub>1</sub>, …, <i>x</i><sub><i>n</i></sub></span>, let <span class="m"><i>x</i><sub>(1)</sub> ≤ <i>x</i><sub>(2)</sub> ≤ ⋯ ≤ <i>x</i><sub>(<i>n</i>)</sub></span> be the values in increasing order.</p>
<div class="display"><b>Mean:</b> <span class="c1"><i>x̄</i></span> = <span class="fr"><span>1</span><span><i>n</i></span></span> ∑<sub><i>i</i>=1</sub><sup><i>n</i></sup> <i>x</i><sub><i>i</i></sub> &nbsp;&nbsp; <span class="dim">∑ (<i>x</i><sub><i>i</i></sub> − <i>x̄</i>) = 0</span><br><b>Median:</b> <span class="c2"><i>x</i><sub>((<i>n</i>+1)/2)</sub></span> if <i>n</i> is odd; &nbsp;<span class="c2"><span class="fr"><span><i>x</i><sub>(<i>n</i>/2)</sub> + <i>x</i><sub>(<i>n</i>/2+1)</sub></span><span>2</span></span></span> if <i>n</i> is even<br><b>Mode:</b> any value of greatest frequency</div>
<p>The deviations from the mean sum to zero, which is why the mean is the balance point. A data set may have one mode, several modes, or none (when every value occurs equally often). The mean minimises the sum of squared deviations, and the median minimises the sum of absolute deviations.</p>`,
  legend: [

ARITH["percent-apps"] = {
  title: "Percent Change, Tax & Interest",
  short: "Discounts, tax, growth and interest",
  grade: "Grades 7–8; revisited in personal finance",
  hours: 8,
  voice: "plain",
  eyebrow: "Applied percents · growth and interest",
  hero: `<span class="m"><i>A</i> = <span class="c1"><i>P</i></span>(1 + <span class="c4"><i>r</i></span>)<sup><i>t</i></sup></span>`,
  lede: `Compound interest multiplies by the same factor <span class="m">1 + <span class="c4"><i>r</i></span></span> each period. Simple interest adds the same amount each period instead.`,
  plain: `<p>Most real uses of percents are about change. A price goes up 15%, a jacket is 30% off, sales tax adds 8%, a savings account earns 5% a year. The trick that ties them together is the <b>multiplier</b>. A 15% increase means multiply by 1.15. A 30% discount means multiply by 0.70. Adding 8% tax means multiply by 1.08.</p>
<p><b>Percent change</b> compares the change to where you started: new minus old, divided by old. Always divide by the old value.</p>
<p>Interest is the price of borrowing money. With <b>simple interest</b>, you earn the same amount every year, based only on the original deposit. With <b>compound interest</b>, each year's interest is added to the balance, and next year you earn interest on that too. Over short times the difference is small. Over decades it is huge, which is why compound growth matters so much for savings and debt.</p>`,
  formal: `<p>For an original value <span class="m"><i>V</i><sub>0</sub> ≠ 0</span> and a new value <span class="m"><i>V</i><sub>1</sub></span>, the <b>percent change</b> is <span class="m">100 · (<i>V</i><sub>1</sub> − <i>V</i><sub>0</sub>)/<i>V</i><sub>0</sub></span>. A change by rate <span class="m"><i>r</i></span> (as a decimal) multiplies by <span class="m">1 + <i>r</i></span>, so a price with tax rate <span class="m"><i>s</i></span> totals <span class="m"><i>x</i>(1 + <i>s</i>)</span> and a discount <span class="m"><i>d</i></span> leaves <span class="m"><i>x</i>(1 − <i>d</i>)</span>.</p>
<div class="display">Simple interest: &nbsp;<span class="c2"><i>A</i> = <span class="c1"><i>P</i></span>(1 + <span class="c4"><i>r</i></span><i>t</i>)</span> &nbsp;<span class="dim">(<i>I</i> = <i>Prt</i>)</span><br>Compound interest: &nbsp;<span class="c3"><i>A</i> = <span class="c1"><i>P</i></span>(1 + <span class="c4"><i>r</i></span>/<i>n</i>)<sup><i>nt</i></sup></span><br><span class="dim">Continuous compounding: <i>A</i> = <i>P</i>e<sup><i>rt</i></sup></span></div>
<p>Here <span class="m c1"><i>P</i></span> is the principal, <span class="m c4"><i>r</i></span> the annual rate as a decimal, <span class="m"><i>t</i></span> the time in years and <span class="m"><i>n</i></span> the number of compounding periods per year. Simple interest grows linearly in <span class="m"><i>t</i></span>. Compound interest grows exponentially. Successive percent changes multiply: an increase of <span class="m"><i>r</i><sub>1</sub></span> then <span class="m"><i>r</i><sub>2</sub></span> gives the factor <span class="m">(1 + <i>r</i><sub>1</sub>)(1 + <i>r</i><sub>2</sub>)</span>.</p>`,
  legend: [

    { c: "c2", sym: `<i>P</i>(1 + <i>rt</i>)`, name: "Simple interest balance", desc: "Grows by the same amount P·r each year. A straight line on the chart." },
    { c: "c3", sym: `<i>P</i>(1 + <i>r</i>)<sup><i>t</i></sup>`, name: "Compound balance", desc: "Grows by the same factor each year. A curve that bends upward." },
    { c: "c5", sym: `<i>t</i>`, name: "Time", desc: "Number of years. With n periods per year the exponent becomes nt." }
  ],
  steps: { title: "How to handle percent change and interest", items: [
    `Convert the percent to a decimal rate <span class="m c4"><i>r</i></span>.`,

    `For percent change, compute <span class="m">(new − old) ÷ old</span> and convert to a percent.`,
    `For simple interest, compute <span class="m"><i>I</i> = <span class="c1"><i>P</i></span><span class="c4"><i>r</i></span><i>t</i></span> and add it to the principal.`,
    `For compound interest, divide the annual rate by the periods per year <span class="m"><i>n</i></span>, raise <span class="m">1 + <i>r</i>/<i>n</i></span> to the power <span class="m"><i>nt</i></span>, and multiply by <span class="m c1"><i>P</i></span>.`,
    `Round money to the cent only at the end.`

  example: {
    prompt: `You deposit $2,000 at 5% annual interest for 3 years. How much do you have with simple interest? With interest compounded once a year?`,
    lines: [
      { math: `<span class="m"><i>I</i> = <span class="c1">2,000</span> × <span class="c4">0.05</span> × 3 = 300</span>`, note: "Simple interest earns $100 each year for 3 years." },

  const t = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const two = x => x < 20 ? a[x] : t[Math.floor(x / 10)] + (x % 10 ? "-" + a[x % 10] : "");
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + " hundred" + (x % 100 ? " " : "") : "") + (x % 100 ? two(x % 100) : "");
  const parts = []; const units = ["", " thousand", " million", " billion"]; let i = 0;
  while (n > 0) { const c = n % 1000; if (c) parts.unshift(three(c) + units[i]); n = Math.floor(n / 1000); i++; }

}

/* ---------- place value: base-ten blocks ---------- */

/* ---------- rounding ---------- */

  k.loop(dt => {
    dx = lerp(dx, x, Math.min(1, dt * 12));
    c.begin(); const { w, h } = c;

/* ---------- column addition / subtraction engine ---------- */
function columnLab(k, op){

          for (let q = j - 1; q > i; q--) { top[q] = 9; hist[q].push({ v: 9, at: i }); }

  }

  build();
  const na = k.number(`<span class="c2"><i>a</i></span>`, 0, 999999, A, v => { A = v; build(); st.reset(); });
  const nb = k.number(`<span class="c3"><i>b</i></span>`, 0, 999999, B, v => { B = v; build(); na.set(A); nb.set(B); st.reset(); });
  const st = k.stepper(() => plan.steps.length, () => {}, { ms: 1100 });
  k.button("New numbers", () => { A = 1000 + Math.floor(Math.random() * 9000); B = 100 + Math.floor(Math.random() * 9000); build(); na.set(A); nb.set(B); st.reset(); }, "btn ghost");

    }

      for (let i = 0; i < lenB; i++) d.text(String(plan.b[i]), colX(i), yB, { font: `${fs}px ${F.mono}`, color: C.pink, align: "center" });
      plan.steps.forEach((s, j) => { if (j < K) { d.text(String(s.digit), colX(s.i), yS, { font: `${fs}px ${F.mono}`, color: C.green, align: "center" }); if (!s.final && s.cout) d.text("1", colX(s.i + 1), yC, { font: `${Math.round(fs * .6)}px ${F.mono}`, color: C.amber, align: "center" }); } });

      <div class="ro-rows"><div class="row">${M("step")} <span class="v">${Math.min(K + 1, plan.steps.length)} of ${plan.steps.length}</span><span class="lbl">work right to left, one place value at a time</span></div></div>

L["addition"] = k => columnLab(k, "+");
L["subtraction"] = k => columnLab(k, "−");

/* ---------- multiplication: area model ---------- */
L["multiplication"] = k => {
  const { C, F, M } = k; const c = k.canvas(); const d = c.d;
  let a = 23, b = 14, da = 23, db = 14, grid = true;
  k.slider(`<span class="c2"><i>a</i></span>`, 1, 99, 1, a, v => a = v);
  k.slider(`<span class="c3"><i>b</i></span>`, 1, 99, 1, b, v => b = v);
  k.check("Unit squares", true, v => grid = v);
  const split = n => n >= 10 && n % 10 ? [n - n % 10, n % 10] : [n];
  k.loop(dt => {
    da = lerp(da, a, Math.min(1, dt * 8)); db = lerp(db, b, Math.min(1, dt * 8));
    c.begin(); const { w, h } = c;
    const sc = Math.min((w - 110) / Math.max(da, 1), (h - 100) / Math.max(db, 1));
    const ox = 70, oy = 54;
    const pa = split(a), pb = split(b);
    const fa = da / a, fb = db / b;
    let x = ox; const shades = [.55, .38, .38, .22];
    pa.forEach((wa, i) => { let y = oy; pb.forEach((hb, j) => {
      const W = wa * sc * fa, H = hb * sc * fb;
      d.rect(x, y, W, H, k.alpha(C.amber, shades[i + j * 1 + (i && j ? 1 : 0)] || .3), C.amber, 1.5);
      if (grid && sc > 3.2) { c.g.save(); c.g.strokeStyle = k.alpha("#0B1019", .35); c.g.lineWidth = 1; c.g.beginPath(); for (let q = 1; q < wa; q++) { c.g.moveTo(x + q * sc * fa, y); c.g.lineTo(x + q * sc * fa, y + H); } for (let q = 1; q < hb; q++) { c.g.moveTo(x, y + q * sc * fb); c.g.lineTo(x + W, y + q * sc * fb); } c.g.stroke(); c.g.restore(); }
      if (W > 34 && H > 22) d.text(`${wa}×${hb}=${wa * hb}`, x + W / 2, y + H / 2, { font: `600 ${Math.min(18, Math.max(11, W / 7))}px ${F.mono}`, color: "#FFF3D6", align: "center", base: "middle" });
      y += H; }); x += wa * sc * fa; });
    x = ox; pa.forEach(wa => { const W = wa * sc * fa; d.line(x + 2, oy - 14, x + W - 2, oy - 14, C.cyan, 2); d.text(String(wa), x + W / 2, oy - 22, { font: `600 15px ${F.mono}`, color: C.cyan, align: "center" }); x += W; });
    let y = oy; pb.forEach(hb => { const H = hb * sc * fb; d.line(ox - 14, y + 2, ox - 14, y + H - 2, C.pink, 2); d.text(String(hb), ox - 22, y + H / 2, { font: `600 15px ${F.mono}`, color: C.pink, align: "right", base: "middle" }); y += H; });
    const parts = []; pa.forEach(x1 => pb.forEach(y1 => parts.push([x1, y1])));
    const prodRows = split(b).length > 1 ? `<div class="row">${M(`${a} × ${pb[1]}`)} = <span class="v c1">${a * pb[1]}</span></div><div class="row">${M(`${a} × ${pb[0]}`)} = <span class="v c1">${a * pb[0]}</span><span class="lbl">standard algorithm: one row per digit of b, shifted one place</span></div>` : "";
    k.setRO(`<div><h2>Product</h2><div class="ro-big" style="margin-top:8px"><span class="c2">${a}</span> × <span class="c3">${b}</span> = <span class="num c5">${(a * b).toLocaleString("en-US")}</span></div></div>
      <div class="ro-rows">${parts.map(([p, q]) => `<div class="row">${M(`<span class="c2">${p}</span> × <span class="c3">${q}</span>`)} = <span class="v c1">${p * q}</span></div>`).join("")}
      <div class="row">${M("sum of parts")} = <span class="v c5">${parts.map(([p, q]) => p * q).join(" + ")} = ${a * b}</span><span class="lbl">the distributive law: split each factor by place value</span></div>${prodRows}</div>
      <div class="landmark"><div class="big">${M(`<i>a</i> × <i>b</i> = area`)}</div><div class="note">A rectangle ${a} units wide and ${b} tall holds ${a * b} unit squares.</div></div>`);
  });
};

/* ---------- division: long division stepper ---------- */
L["division"] = k => {
  const { C, F, M } = k; const c = k.canvas(); const d = c.d;
  let A = 1357, B = 6, plan;
  function build(){
    const dg = String(A).split("").map(Number); let rem = 0, started = false; const steps = [];
    for (let i = 0; i < dg.length; i++) { const cur = rem * 10 + dg[i]; if (!started && cur < B && i < dg.length - 1) { rem = cur; continue; } started = true; const q = Math.floor(cur / B), prod = q * B, r = cur - prod; steps.push({ i, cur, q, prod, r, last: i === dg.length - 1, next: dg[i + 1] }); rem = r; }

    plan = { dg, steps, phases, q: Math.floor(A / B), r: A % B };
  }
  build();
  k.number(`<span class="c2">dividend</span>`, 1, 99999, A, v => { A = v; build(); st.reset(); });
  k.number(`<span class="c3">divisor</span>`, 1, 99, B, v => { B = v; build(); st.reset(); }, "70px");
  const st = k.stepper(() => plan.phases.length, () => {}, { ms: 900 });
  k.loop(() => {
    c.begin(); const { w, h } = c; const K = st.k; const n = plan.dg.length;
    const rows = 2 + plan.steps.length * 2;
    const ch = Math.min(38, (h - 40) / (rows + 1.2)), fs = Math.round(ch * .78), cw = fs * .62;
    const bw = String(B).length * cw + 20;
    const x0 = (w - (n * cw + bw)) / 2 + bw, yQ = 20 + ch, yD = yQ + ch * 1.1;
    const colX = i => x0 + (i + .5) * cw;
    const txt = (s, col, y, color) => { const str = String(s); for (let q = 0; q < str.length; q++) d.text(str[q], colX(col - str.length + 1 + q), y, { font: `${fs}px ${F.mono}`, color, align: "center" }); };
    // bracket
    d.text(String(B), x0 - 14, yD, { font: `${fs}px ${F.mono}`, color: C.pink, align: "right" });
    c.g.save(); c.g.strokeStyle = C.text; c.g.lineWidth = 2; c.g.beginPath(); c.g.moveTo(x0 - 6, yD + ch * .25); c.g.quadraticCurveTo(x0 + 4, yD - ch * .3, x0 - 4, yD - ch * .82); c.g.lineTo(x0 + n * cw + 8, yD - ch * .82); c.g.stroke(); c.g.restore();
    plan.dg.forEach((v, i) => d.text(String(v), colX(i), yD, { font: `${fs}px ${F.mono}`, color: C.cyan, align: "center" }));
    const done = K >= plan.phases.length;
    const [cj, cp] = done ? [plan.steps.length, 0] : plan.phases[K];
    let y = yD;
    plan.steps.forEach((s, j) => {
      const vis = p => j < cj || (j === cj && p <= cp);
      if (vis(0)) d.text(String(s.q), colX(s.i), yQ, { font: `${fs}px ${F.mono}`, color: C.amber, align: "center" });
      if (vis(1)) { y += ch; txt(s.prod, s.i, y, C.text); d.text("−", colX(s.i - String(s.prod).length) , y, { font: `${fs}px ${F.mono}`, color: C.faint, align: "center" }); }
      if (vis(2)) { d.line(colX(s.i - String(s.cur).length + 1) - cw / 2, y + ch * .28, colX(s.i) + cw / 2, y + ch * .28, C.text, 1.5); y += ch; txt(s.r, s.i, y, s.last ? C.violet : C.text); }
      if (vis(3)) { d.text(String(s.next), colX(s.i + 1), y, { font: `${fs}px ${F.mono}`, color: C.cyan, align: "center" }); d.arrow(colX(s.i + 1), yD + 6, colX(s.i + 1), y - ch * .8, k.alpha(C.cyan, .45), 1.5); }
      if (j === cj && !done) { const top = cp === 0 ? yD : y; void top; }
    });
    let lm, narr;
    if (done) { lm = `<div class="big">${M(`<span class="c2">${A}</span> = <span class="c3">${B}</span> × <span class="c1">${plan.q}</span> + <span class="c4">${plan.r}</span>`)}</div><div class="note">The division algorithm: dividend = divisor × quotient + remainder, with 0 ≤ r &lt; ${B}.</div>`; narr = "Finished. Multiply back to check."; }
    else { const s = plan.steps[cj];
      lm = [
        `<div class="big">${M(`${s.cur} ÷ <span class="c3">${B}</span> → <span class="c1">${s.q}</span>`)}</div><div class="note"><b>Divide.</b> How many ${B}s fit in ${s.cur}? ${s.q}, since ${B} × ${s.q + 1} = ${B * (s.q + 1)} is too big.</div>`,
        `<div class="big">${M(`<span class="c1">${s.q}</span> × <span class="c3">${B}</span> = ${s.prod}`)}</div><div class="note"><b>Multiply.</b> Write the product under ${s.cur}.</div>`,
        `<div class="big">${M(`${s.cur} − ${s.prod} = ${s.r}`)}</div><div class="note"><b>Subtract.</b> The difference must be less than ${B}, or the quotient digit was too small.</div>`,
        `<div class="big">${M(`bring down ${s.next} → ${s.r * 10 + s.next}`)}</div><div class="note"><b>Bring down</b> the next digit of the dividend and repeat.</div>`][cp];

    k.setRO(`<div><h2>Result</h2><div class="ro-big" style="margin-top:8px"><span class="c2">${sgn(a)}</span> ${op === "*" ? "×" : op === "-" ? "−" : "+"} <span class="c3">${par(b)}</span> = <span class="num c1">${sgn(res)}</span></div></div>
      <div class="ro-rows"><div class="row">${M("|<i>a</i>|")} = <span class="v">${Math.abs(a)}</span>, ${M("|<i>b</i>|")} = <span class="v">${Math.abs(b)}</span><span class="lbl">absolute value: distance from 0</span></div>
      <div class="row">${M("−<i>b</i>")} = <span class="v">${sgn(-b)}</span><span class="lbl">the opposite of b, mirrored across 0</span></div>

};

/* ---------- factors ---------- */

      <div class="narr" style="margin-top:6px">${fs.length} factor${fs.length > 1 ? "s" : ""} · ${kind}${sq && n > 1 ? " · perfect square (" + Math.sqrt(n) + " × " + Math.sqrt(n) + ")" : ""}</div></div>

/* ---------- exponents ---------- */
L["exponents"] = k => {
  const { C, F, M } = k; const c = k.canvas(); const d = c.d;
  let b = 2, n = 5, log = false, grow = 0;
  k.slider(`<span class="c2"><i>b</i></span>`, 0, 10, 1, b, v => { b = v; grow = 0; });
  k.slider(`<span class="c3"><i>n</i></span>`, -3, 8, 1, n, v => { n = v; grow = 0; });
  k.check("Log scale", false, v => log = v);
  const val = (B, N) => (B === 0 && N <= 0) ? (N === 0 ? 1 : NaN) : Math.pow(B, N);
  k.loop(dt => {
    grow = Math.min(1, grow + dt * 1.6);
    c.begin(); const { w, h } = c;
    // expanded product
    const m = Math.abs(n), boxes = Math.min(m, 8);
    const bw = Math.min(54, (w - 80) / Math.max(1, boxes * 1.5)), gap = bw * .5;
    const tw = boxes * bw + (boxes - 1) * gap; let x = (w - tw) / 2; const y = 40;
    if (n === 0) d.text(b === 0 ? "0⁰: often set to 1 in algebra, undefined in basic arithmetic" : "no factors at all: the empty product is 1", w / 2, y + bw * .6, { font: `20px ${F.math}`, color: C.text, align: "center" });
    for (let i = 0; i < boxes; i++) { d.rr(x, y, bw, bw, 4, k.alpha(C.cyan, .18), C.cyan, 1.5); d.text(String(b), x + bw / 2, y + bw / 2 + 1, { font: `${bw * .5}px ${F.mono}`, color: C.cyan, align: "center", base: "middle" }); if (i < boxes - 1) d.text("×", x + bw + gap / 2, y + bw / 2, { font: `${bw * .4}px ${F.math}`, color: C.faint, align: "center", base: "middle" }); x += bw + gap; }
    if (m > 0) { const x0 = (w - tw) / 2; d.line(x0, y + bw + 10, x0 + tw, y + bw + 10, C.pink, 2); d.text(`${m} factor${m > 1 ? "s" : ""}${n < 0 ? ", then take the reciprocal" : ""}`, w / 2, y + bw + 28, { font: `14px ${F.sans}`, color: C.pink, align: "center" }); }
    // bars b^0..b^max
    const top = y + bw + 50, base = h - 36, maxK = Math.max(1, n, 0);
    const ks = []; for (let q = Math.min(0, n); q <= maxK; q++) ks.push(q);
    const vals = ks.map(q => val(b, q)).map(v => isFinite(v) ? v : 0);
    const vmax = Math.max(...vals, 1);
    const colw = Math.min(64, (w - 80) / ks.length);
    const x00 = (w - colw * ks.length) / 2;
    const hmax = base - top - 26;
    ks.forEach((q, i) => {
      const v = vals[i];
      let fr = log ? (v > 0 ? (Math.log10(v) - Math.log10(Math.min(...vals.filter(z => z > 0), 1)) + .15) / (Math.log10(vmax) - Math.log10(Math.min(...vals.filter(z => z > 0), 1)) + .15) : 0) : v / vmax;
      fr = Math.max(0, fr) * (q === n ? grow : 1);
      const H = Math.max(v > 0 ? 2 : 0, fr * hmax), xx = x00 + i * colw + colw * .15, on = q === n;
      d.rect(xx, base - H, colw * .7, H, k.alpha(on ? C.amber : C.cyan, on ? .8 : .3), on ? C.amber : null, 1.5);
      d.pow(String(b), sgn(q), xx + colw * .35 - d.powW(String(b), sgn(q), 13, F.mono) / 2, base + 18, { size: 13, family: F.mono, color: on ? C.amber : C.faint, ecolor: on ? C.pink : C.faint });
      if (on || colw > 50) d.text(v >= 1e6 ? v.toExponential(1) : k.fmt(v, 4), xx + colw * .35, base - H - 8, { font: `12px ${F.mono}`, color: on ? C.amber : C.muted, align: "center" });
    });
    const V = val(b, n);
    const exp = n > 0 ? Array(Math.min(n, 8)).fill(b).join(" × ") + (n > 8 ? " × …" : "") : n === 0 ? "1" : `1 ÷ (${Array(m).fill(b).join(" × ")})`;
    const vs = b === 0 && n === 0 ? "1 (by convention)" : isNaN(V) ? "undefined" : V >= 1e15 ? V.toExponential(3) : k.fmt(V, 6);
    k.setRO(`<div><h2>Power</h2><div class="ro-big" style="margin-top:8px"><span class="c2">${b}</span><sup class="c3">${sgn(n)}</sup> = <span class="num c1">${vs}</span></div><div class="narr" style="margin-top:4px">${M(exp)}${n < 0 && b ? " = " + frac(1, Math.pow(b, m)) : ""}</div></div>
      <div class="ro-rows">
        <div class="row">${M(`<i>b</i><sup><i>m</i></sup> · <i>b</i><sup><i>n</i></sup> = <i>b</i><sup><i>m</i>+<i>n</i></sup>`)}<span class="lbl">e.g. ${b}² · ${b}³ = ${b}⁵ = ${k.fmt(Math.pow(b, 5))}</span></div>
        <div class="row">${M(`(<i>b</i><sup><i>m</i></sup>)<sup><i>n</i></sup> = <i>b</i><sup><i>mn</i></sup>`)}<span class="lbl">a power of a power multiplies the exponents</span></div>
        <div class="row">${M(`<i>b</i><sup>0</sup> = 1,  <i>b</i><sup>−<i>n</i></sup> = 1 / <i>b</i><sup><i>n</i></sup>`)}<span class="lbl">for b ≠ 0; each step down the exponent divides by b</span></div></div>
      <div class="landmark${n === 0 || n < 0 ? " hit" : ""}"><div class="big">${M(n === 0 ? "<i>b</i><sup>0</sup> = 1" : n < 0 ? "negative exponent = reciprocal" : `${b}<sup>${n}</sup> ÷ ${b} = ${b}<sup>${n - 1}</sup>`)}</div><div class="note">${b === 0 && n < 0 ? "0 has no reciprocal, so 0 to a negative power is undefined." : n === 0 ? `Divide ${b}¹ = ${b} by ${b} once more and you land on 1.` : n < 0 ? `Keep dividing by ${b} below ${b}⁰ = 1.` : "Moving one bar left divides by the base."}</div></div>`);
  });
  function frac(a, bb){ return `<span class="m"><span class="fr"><span>${a}</span><span>${bb.toLocaleString("en-US")}</span></span></span>`; }

/* ---------- modular (clock) ---------- */
L["modular"] = k => {
  const { C, F, M } = k; const c = k.canvas(); const d = c.d;
  let m = 12, a = 9, b = 8, op = "+", t0 = 0, clock = 0;
  const re = () => t0 = clock;
  k.slider(`<span class="c4"><i>m</i></span>`, 2, 24, 1, m, v => { m = v; re(); });
  k.slider(`<span class="c2"><i>a</i></span>`, 0, 40, 1, a, v => { a = v; re(); });
  k.select("op", [["+", "+"], ["*", "×"]], op, v => { op = v; re(); });
  k.slider(`<span class="c3"><i>b</i></span>`, 0, 40, 1, b, v => { b = v; re(); });
  k.button("Replay", re, "btn ghost");
  k.loop(dt => {
    clock += dt; c.begin(); const { w, h } = c;
    const total = op === "+" ? a + b : a * b;
    const cx = w / 2, cy = h / 2 + 14, R = Math.min(w, h) / 2 - 60;
    const ang = v => -Math.PI / 2 + (v % m) / m * Math.PI * 2;
    d.circle(cx, cy, R, k.alpha(C.panel2, .6), C.line2, 2);
    for (let i = 0; i < m; i++) { const A = ang(i), x = cx + Math.cos(A) * R, y = cy + Math.sin(A) * R; d.circle(x, y, 5, C.faint); d.text(String(i), cx + Math.cos(A) * (R + 22), cy + Math.sin(A) * (R + 22), { font: `600 14px ${F.mono}`, color: i === total % m ? C.amber : C.muted, align: "center", base: "middle" }); }
    // animate steps: first a (cyan) then b steps (pink) [for ×: a jumps of b]
    const speed = k.reduce ? 1e6 : Math.max(8, (op === "+" ? a + b : a) / 3);
    const el = (clock - t0) * speed;
    let pos, laps;
    const trail = (from, to, col, rr) => { if (to <= from) return; const g = c.g; g.save(); g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); const N = Math.max(8, Math.ceil((to - from) * 6)); for (let i = 0; i <= N; i++) { const v = from + (to - from) * i / N; const A = -Math.PI / 2 + v / m * Math.PI * 2; const r = rr - v / m * 5; const x = cx + Math.cos(A) * r, y = cy + Math.sin(A) * r; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.restore(); };
    if (op === "+") { const pa = Math.min(a, el), pb = Math.max(0, Math.min(b, el - a)); trail(0, pa, k.alpha(C.cyan, .8), R - 18); trail(a, a + pb, k.alpha(C.pink, .8), R - 18 - a / m * 5); pos = pa + pb; }
    else { const jumps = Math.min(a, el); for (let j = 0; j < Math.floor(jumps); j++) trail(j * b, (j + 1) * b, k.alpha(j % 2 ? C.pink : C.cyan, .7), R - 18); const fr = jumps - Math.floor(jumps); trail(Math.floor(jumps) * b, (Math.floor(jumps) + fr) * b, k.alpha(C.pink, .7), R - 18); pos = jumps * b; }
    laps = Math.floor(pos / m);
    const A = -Math.PI / 2 + pos / m * Math.PI * 2;
    d.line(cx, cy, cx + Math.cos(A) * (R - 12), cy + Math.sin(A) * (R - 12), C.amber, 3); d.circle(cx, cy, 6, C.amber);
    d.text(`${op === "+" ? a + " + " + b : a + " × " + b} = ${total}`, cx, cy + 6, { font: `16px ${F.mono}`, color: C.muted, align: "center", base: "top" });
    d.text(`laps: ${laps}`, 16, 26, { font: `14px ${F.sans}`, color: C.muted });
    const q = Math.floor(total / m), r = total % m;
    k.setRO(`<div><h2>Residue</h2><div class="ro-big" style="margin-top:8px">${total} mod <span class="c4">${m}</span> = <span class="num c1">${r}</span></div></div>
      <div class="ro-rows"><div class="row">${M(`${total} = <span class="c4">${m}</span> × ${q} + <span class="c1">${r}</span>`)}<span class="lbl">division algorithm: ${q} full laps, ${r} left over</span></div>
      <div class="row">${M(`${total} ≡ ${r} (mod ${m})`)}<span class="lbl">congruent: same remainder on division by ${m}</span></div>
      <div class="row">${M(`(<span class="c2">${a % m}</span> ${op === "+" ? "+" : "×"} <span class="c3">${b % m}</span>) mod ${m} = ${(op === "+" ? (a % m + b % m) : (a % m) * (b % m)) % m}`)}<span class="lbl">reduce first, then combine: same answer</span></div></div>
      <div class="landmark${r === 0 ? " hit" : ""}"><div class="big">${M(r === 0 ? `${m} ∣ ${total}` : `${r} ≠ 0`)}</div><div class="note">${r === 0 ? `A remainder of 0 means ${m} divides ${total} exactly. The hand is back at the top.` : `Clocks use m = 12, days of the week use m = 7, and computer hash tables use a large m.`}</div></div>`);
  });
};

/* ---------- primes: sieve + factor tree ---------- */
L["primes"] = k => {
  const { C, F, M } = k; const c = k.canvas(); const d = c.d;
  let mode = "sieve", N = 360;
  const MAXS = 120;
  let crossed = new Set(), primesDone = [], curP = 0, queue = [], acc = 0, playing = false;
  const resetSieve = () => { crossed = new Set([1]); primesDone = []; curP = 0; queue = []; playing = false; pb.textContent = "Play"; };
  const nextPrime = () => { let p = (curP || 1) + 1; while (p <= MAXS && crossed.has(p)) p++; return p; };
  const stepPrime = () => { if (queue.length) return; const p = nextPrime(); if (p > MAXS) return; curP = p; primesDone.push(p); if (p * p <= MAXS) for (let q = p * p; q <= MAXS; q += p) queue.push(q); };
  k.modes([["sieve", "Sieve of Eratosthenes"], ["tree", "Factor tree"]], mode, m => { mode = m; ctlS.forEach(e => e.hidden = m !== "sieve"); ctlT.forEach(e => e.hidden = m !== "tree"); });
  const pb = k.button("Play", () => { playing = !playing; pb.textContent = playing ? "Pause" : "Play"; });
  const sb = k.button("Next prime", () => { while (queue.length) crossed.add(queue.shift()); stepPrime(); }, "btn ghost");
  const rb = k.button("Reset", resetSieve, "btn ghost");
  const nt = k.number("<i>n</i>", 2, 999999, N, v => N = v);
  const ctlS = [pb, sb, rb], ctlT = [nt.el.parentElement]; ctlT.forEach(e => e.hidden = true);
  resetSieve();
  const factor = n => { const f = []; let x = n; for (let p = 2; p * p <= x; p++) while (x % p === 0) { f.push(p); x /= p; } if (x > 1) f.push(x); return f; };
  k.loop(dt => {
    c.begin(); const { w, h } = c;
    if (mode === "sieve") {
      const isDone = () => !queue.length && nextPrime() ** 2 > MAXS;
      if (playing) { acc += dt; const rate = .045; let guard = 0; while ((acc > rate || k.reduce) && guard++ < 200) { acc = Math.max(0, acc - rate); if (queue.length) crossed.add(queue.shift()); else if (isDone()) { playing = false; pb.textContent = "Play"; break; } else stepPrime(); } }
      const cols = 10, rows = MAXS / cols, cell = Math.min((w - 40) / cols, (h - 84) / rows), ox = (w - cols * cell) / 2, oy = 74;
      const finished = isDone();
      for (let i = 1; i <= MAXS; i++) {
        const x = ox + ((i - 1) % cols) * cell, y = oy + Math.floor((i - 1) / cols) * cell;
        const isP = primesDone.includes(i) || (finished && !crossed.has(i));
        const isCur = i === curP, isX = crossed.has(i), inQ = queue[0] === i;
        const multOfCur = curP && i % curP === 0 && i !== curP && isX;
        d.rr(x + 2, y + 2, cell - 4, cell - 4, 3, isP ? k.alpha(C.amber, isCur ? .8 : .45) : multOfCur ? k.alpha(C.pink, .28) : isX ? k.alpha(C.panel3, .6) : k.alpha(C.panel2, .9), isCur ? C.amber : inQ ? C.pink : k.alpha(C.line2, .6), isCur ? 2 : 1);
        d.text(String(i), x + cell / 2, y + cell / 2 + 1, { font: `${Math.max(10, cell * .34)}px ${F.mono}`, color: isP ? "#FFF3D6" : isX ? C.faint : C.text, align: "center", base: "middle" });
      }
      const allP = []; for (let i = 2; i <= MAXS; i++) if (!crossed.has(i) && (finished || primesDone.includes(i))) allP.push(i);
      d.text(finished ? "every number not crossed out is prime" : curP ? `crossing out multiples of ${curP}, starting at ${curP}² = ${curP * curP}` : "press Play or Next prime", w / 2, 64, { font: `14px ${F.sans}`, color: C.muted, align: "center" });
      k.setRO(`<div><h2>Primes found</h2><div class="ro-big" style="margin-top:8px"><span class="num c1">${finished ? allP.length : primesDone.length}</span> <span style="font-size:.5em;color:var(--muted)">up to ${MAXS}</span></div></div>
        <p class="narr" style="color:var(--amber)">${(finished ? allP : primesDone).join(", ")}</p>
        <div class="landmark${finished ? " hit" : ""}"><div class="big">${M(finished ? "√120 ≈ 10.95, so stop after 7" : curP ? `start at ${curP}<sup>2</sup> = ${curP * curP}` : "start with 2")}</div><div class="note">${finished ? "Any composite number up to 120 has a prime factor no bigger than 10. Those are 2, 3, 5 and 7, all already sieved." : "Smaller multiples of this prime were already crossed out by smaller primes."}</div></div>
        <p class="narr">1 is not prime: a prime has exactly two positive divisors, 1 and itself.</p>`);
    } else {
      const f = factor(N);
      const depth = f.length;
      const rowH = Math.min(58, (h - 60) / Math.max(1, depth));
      const stepX = Math.min(70, (w - 120) / Math.max(1, depth));
      let x = 60 + (w - 120 - stepX * (depth - 1)) / 2 - stepX * .3, y = 34, cur = N;
      const fsz = Math.max(12, Math.min(18, rowH * .32));
      for (let i = 0; i < depth; i++) {
        const isLast = i === depth - 1;
        if (isLast) { d.circle(x, y, fsz * 1.3, k.alpha(C.amber, .3), C.amber, 2); d.text(String(cur), x, y + 1, { font: `600 ${fsz}px ${F.mono}`, color: C.amber, align: "center", base: "middle" }); break; }
        d.text(String(cur), x, y, { font: `600 ${fsz}px ${F.mono}`, color: C.text, align: "center", base: "middle" });
        const p = f[i], rest = cur / p, lx = x - stepX * .55, rx = x + stepX, ny = y + rowH;
        d.line(x - 6, y + fsz * .8, lx, ny - fsz * 1.2, C.line2, 1.5); d.line(x + 6, y + fsz * .8, rx, ny - fsz * .8, C.line2, 1.5);
        d.circle(lx, ny, fsz * 1.2, k.alpha(C.amber, .3), C.amber, 2); d.text(String(p), lx, ny + 1, { font: `600 ${fsz}px ${F.mono}`, color: C.amber, align: "center", base: "middle" });
        x = rx; y = ny; cur = rest;
      }
      const cnt = {}; f.forEach(p => cnt[p] = (cnt[p] || 0) + 1);
      const pf = Object.entries(cnt).map(([p, e]) => `<span class="c1">${p}</span>${e > 1 ? `<sup>${e}</sup>` : ""}`).join(" × ");
      const divs = Object.values(cnt).reduce((s, e) => s * (e + 1), 1);
      k.setRO(`<div><h2>Prime factorization</h2><div class="ro-big" style="margin-top:8px">${N.toLocaleString("en-US")} = ${pf}</div></div>
        <div class="ro-rows"><div class="row">${M("prime?")} <span class="v">${f.length === 1 ? "yes" : "no, composite"}</span></div>
        <div class="row">${M("number of divisors")} <span class="v">${divs}</span><span class="lbl">multiply (exponent + 1) for each prime: ${Object.values(cnt).map(e => `(${e}+1)`).join("")}</span></div></div>
        <div class="landmark hit"><div class="big">${M("Fundamental Theorem of Arithmetic")}</div><div class="note">Every whole number greater than 1 is a product of primes in exactly one way, apart from the order of the factors.</div></div>
        <p class="narr">The tree splits off the smallest prime each time. Any splitting order ends at the same primes.</p>`);
    }
  });
};

/* ---------- fractions ---------- */
L["fractions"] = k => {
  const { C, F, M, gcd } = k; const c = k.canvas(); const d = c.d;
  let n = 3, dd = 4, s = 2, dn = 3;
  const sn = k.slider(`<span class="c1"><i>n</i></span>`, 0, 12, 1, n, v => n = v);
  k.slider(`<span class="c2"><i>d</i></span>`, 1, 12, 1, dd, v => { dd = v; });
  k.slider(`<span class="c4"><i>k</i></span>`, 1, 6, 1, s, v => s = v);
  void sn;
  k.loop(dt => {
    dn = lerp(dn, n, Math.min(1, dt * 10));
    c.begin(); const { w, h } = c;
    const units = Math.max(1, Math.ceil(n / dd));
    const bx = 50, bwAll = w - 100, uw = bwAll / Math.max(units, 1), bh = Math.min(46, (h - 190) / 3);

      d.text(label, bx - 10, y + bh / 2, { font: `18px ${F.math}`, color: col, align: "right", base: "middle" });
    };

    d.circle(X(dn / dd), ly, 8, C.amber);
    const fr = (a, b, cl) => `<span class="m ${cl}"><span class="fr"><span>${a}</span><span>${b}</span></span></span>`;
    k.setRO(`<div><h2>Fraction</h2><div class="ro-big" style="margin-top:8px">${fr(`<span class="c1">${n}</span>`, `<span class="c2">${dd}</span>`)} = ${fr(n * s, dd * s, "c4")}${g > 1 ? " = " + fr(sn2, sd2, "c5") : ""}</div></div>
      <div class="ro-rows"><div class="row">${M("decimal")} <span class="v">${k.fmt(n / dd, 4)}</span><span class="lbl">${n} ÷ ${dd}</span></div>
      <div class="row">${M("percent")} <span class="v">${k.fmt(n / dd * 100, 2)}%</span></div>
      <div class="row">${M(`gcd(${n}, ${dd})`)} = <span class="v">${gcd(n, dd)}</span><span class="lbl">${g > 1 ? `divide top and bottom by ${g} to simplify` : n ? "already in simplest form" : "0 over anything nonzero is 0"}</span></div></div>
      <div class="landmark${n === dd ? " hit" : ""}"><div class="big">${M(`<span class="fr"><span><i>n</i></span><span><i>d</i></span></span> = <span class="fr"><span><i>n</i>·<i>k</i></span><span><i>d</i>·<i>k</i></span></span>`)}</div><div class="note">${n === dd ? "Numerator equals denominator: the fraction is one whole." : n > dd ? `An improper fraction: more than one whole. It is ${Math.floor(n / dd)} and ${n % dd}/${dd}.` : "Cutting every piece into k smaller pieces changes the names, not the amount shaded."}</div></div>`);

/* ---------- square roots ---------- */
L["roots"] = k => {
  const { C, F, M } = k; const c = k.canvas(); const d = c.d;
  let A = 50, it = 0, dA = 50;
  k.slider(`<span class="c1"><i>A</i></span>`, 1, 150, 1, A, v => { A = v; it = 0; });
  k.button("Next guess", () => it = Math.min(it + 1, 6));
  k.button("Reset guesses", () => it = 0, "btn ghost");
  k.loop(dt => {
    dA = lerp(dA, A, Math.min(1, dt * 8));
    c.begin(); const { w, h } = c;
    const r = Math.sqrt(A), s = Math.floor(r), extra = A - s * s;
    const side = Math.min(w * .52, h - 90), u = side / Math.max(s + 1, 1);
    const ox = 40, oy = 50;
    for (let i = 0; i < s; i++) for (let j = 0; j < s; j++) d.rect(ox + j * u, oy + i * u, u - 1, u - 1, k.alpha(C.amber, .55));
    // extra tiles around the L
    let e = 0; for (let i = 0; i < s && e < extra; i++, e++) d.rect(ox + s * u, oy + i * u, u - 1, u - 1, k.alpha(C.pink, .45));
    for (let j = 0; j <= s && e < extra; j++, e++) d.rect(ox + j * u, oy + s * u, u - 1, u - 1, k.alpha(C.pink, .45));
    // true square
    const S = Math.sqrt(dA) * u; c.g.save(); c.g.setLineDash([6, 4]); d.rect(ox, oy, S, S, null, C.cyan, 2); c.g.restore();
    d.text(`side √A ≈ ${k.fmt(r, 3)}`, ox + S / 2, oy - 12, { font: `15px ${F.math}`, color: C.cyan, align: "center" });
    // guesses on a number line to the right
    const gx0 = ox + side + 50, gx1 = w - 30;
    if (gx1 - gx0 > 120) {
      const lo = Math.max(0, s - 1), hi = s + 2, gy = oy + 40, X = v => gx0 + (gx1 - gx0) * (v - lo) / (hi - lo);
      d.line(gx0, gy, gx1, gy, C.muted, 1.5); for (let v = lo; v <= hi; v++) { d.line(X(v), gy - 6, X(v), gy + 6, C.faint); d.text(String(v), X(v), gy + 20, { font: `12px ${F.mono}`, color: C.faint, align: "center" }); }
      d.line(X(r), gy - 16, X(r), gy + 16, C.cyan, 2);
      let x = Math.floor(Math.sqrt(A)) ** 2 === A ? Math.sqrt(A) : Math.floor(Math.sqrt(A)) + 1; const gs = [x]; for (let i = 0; i < 6; i++) { x = (x + A / x) / 2; gs.push(x); }
      gs.slice(0, it + 1).forEach((g, i) => { if (g >= lo && g <= hi) { d.circle(X(g), gy - 26 - i * 0, 5, i === it ? C.pink : k.alpha(C.pink, .35)); } });
      d.text("Babylonian guesses", gx0, gy - 44, { font: `600 11px ${F.ui}`, color: C.pink });
      gs.slice(0, it + 1).forEach((g, i) => d.text(`x${i} = ${g.toFixed(6)}`, gx0, gy + 50 + i * 20, { font: `13px ${F.mono}`, color: i === it ? C.pink : C.muted }));
    }
    let x = Math.floor(Math.sqrt(A)) ** 2 === A ? Math.sqrt(A) : Math.floor(Math.sqrt(A)) + 1; const gs = [x]; for (let i = 0; i < 6; i++) { x = (x + A / x) / 2; gs.push(x); }
    const perfect = s * s === A;
    k.setRO(`<div><h2>Square root</h2><div class="ro-big" style="margin-top:8px">√<span class="c1">${A}</span> = <span class="num c2">${perfect ? s : r.toFixed(6) + "…"}</span></div></div>
      <div class="ro-rows"><div class="row">${M(perfect ? `${s}<sup>2</sup> = ${A}` : `${s}<sup>2</sup> = ${s * s} &lt; ${A} &lt; ${(s + 1) ** 2} = ${s + 1}<sup>2</sup>`)}<span class="lbl">${perfect ? "a perfect square: the tiles make a complete square" : `so √${A} is between ${s} and ${s + 1}`}</span></div>
      <div class="row">${M(`<i>x</i><sub><i>k</i>+1</sub> = ½(<i>x</i><sub><i>k</i></sub> + <i>A</i>/<i>x</i><sub><i>k</i></sub>)`)}<span class="lbl">Babylonian method: average a guess with A divided by the guess</span></div>
      <div class="row"><span class="m c3">guess ${it}</span> <span class="v c3">${gs[it].toFixed(8)}</span><span class="lbl">error ${Math.abs(gs[it] - r).toExponential(2)}</span></div></div>
      <div class="landmark${perfect ? " hit" : ""}"><div class="big">${M(perfect ? "perfect square" : `√${A} is irrational`)}</div><div class="note">${perfect ? `${A} = ${s} × ${s}.` : `The square root of a whole number that is not a perfect square never ends or repeats as a decimal.`}</div></div>
      <p class="narr">${A - s * s ? `${s * s} gold tiles form a ${s} × ${s} square. The ${A - s * s} pink tile${A - s * s === 1 ? " does" : "s do"} not complete the next square.` : ""}</p>`);
  });
};

/* ---------- gcf / lcm: Euclid tiling ---------- */
L["gcf-lcm"] = k => {
  const { C, F, M, gcd } = k; const c = k.canvas(); const d = c.d;
  let a = 48, b = 18, t0 = 0, clock = 0;
  k.slider(`<span class="c2"><i>a</i></span>`, 1, 60, 1, a, v => { a = v; t0 = clock; });
  k.slider(`<span class="c3"><i>b</i></span>`, 1, 60, 1, b, v => { b = v; t0 = clock; });
  k.button("Replay", () => t0 = clock, "btn ghost");
  k.loop(dt => {
    clock += dt; c.begin(); const { w, h } = c;
    const sq = []; let x = 0, y = 0, W = a, H = b; const steps = [];
    while (W > 0 && H > 0) { if (W >= H) { const q = Math.floor(W / H); for (let i = 0; i < q; i++) sq.push([x + i * H, y, H]); steps.push([W, H, q, W - q * H]); x += q * H; W -= q * H; } else { const q = Math.floor(H / W); for (let i = 0; i < q; i++) sq.push([x, y + i * W, W]); steps.push([H, W, q, H - q * W]); y += q * W; H -= q * W; } }
    const g = gcd(a, b);
    const sc = Math.min((w - 80) / a, (h - 110) / b), ox = (w - a * sc) / 2, oy = 50;
    const shown = k.reduce ? sq.length : Math.min(sq.length, Math.floor((clock - t0) * 5) + 1);
    const palette = [C.cyan, C.pink, C.violet, C.cyan, C.pink, C.violet];
    const sizes = [...new Set(sq.map(s => s[2]))];
    sq.slice(0, shown).forEach(([sx, sy, s]) => { const lvl = sizes.indexOf(s), isG = s === g; d.rect(ox + sx * sc, oy + sy * sc, s * sc, s * sc, k.alpha(isG ? C.amber : palette[lvl], isG ? .6 : .25), isG ? C.amber : palette[lvl], isG ? 2 : 1.2); if (s * sc > 26) d.text(String(s), ox + (sx + s / 2) * sc, oy + (sy + s / 2) * sc, { font: `600 ${Math.min(16, s * sc / 3)}px ${F.mono}`, color: C.text, align: "center", base: "middle" }); });
    d.rect(ox, oy, a * sc, b * sc, null, C.muted, 2);
    d.text(`${a}`, ox + a * sc / 2, oy - 12, { font: `600 15px ${F.mono}`, color: C.cyan, align: "center" }); d.text(`${b}`, ox - 10, oy + b * sc / 2, { font: `600 15px ${F.mono}`, color: C.pink, align: "right", base: "middle" });
    d.text(`largest square that tiles the ${a} × ${b} rectangle: ${g} × ${g}`, w / 2, h - 18, { font: `14px ${F.sans}`, color: shown >= sq.length ? C.amber : C.muted, align: "center" });
    const L_ = a * b / g;
    const mA = [], mB = []; for (let i = 1; i <= 6; i++) { mA.push(a * i); mB.push(b * i); }
    k.setRO(`<div><h2>Greatest common factor</h2><div class="ro-big" style="margin-top:8px">gcd(<span class="c2">${a}</span>, <span class="c3">${b}</span>) = <span class="num c1">${g}</span></div></div>
      <div class="ro-rows">${steps.map(([p, q, m, r]) => `<div class="row">${M(`${p} = ${q} × ${m} + ${r}`)}</div>`).join("")}<div class="row"><span class="lbl">Euclidean algorithm: replace the larger number by the remainder until the remainder is 0. The last nonzero remainder is the gcd.</span></div></div>
      <div class="landmark hit"><div class="big">lcm = ${M(`<span class="fr"><span>${a} × ${b}</span><span>${g}</span></span>`)} = <span class="c4">${L_}</span></div><div class="note">Because gcd(a, b) × lcm(a, b) = a × b.</div></div>
      <p class="narr">Multiples of ${a}: ${mA.map(v => v === L_ ? `<b style="color:var(--violet)">${v}</b>` : v).join(", ")}…<br>Multiples of ${b}: ${mB.map(v => v === L_ ? `<b style="color:var(--violet)">${v}</b>` : v).join(", ")}…</p>`);
  });
};

/* ---------- decimals: hundredths grid ---------- */

  let v = 47, dv = 47;
